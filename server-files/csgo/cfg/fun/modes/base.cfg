// Runs first on every map (FunServer plugin) and resets everything the
// fun modes change, so nothing from one mode leaks into the next map.
// Every cvar a mode config or the window changes must be reset here.
// Freeze time and buy time are not: Valve's gamemode config sets them for
// every mode on every map start, and each mode config has its own.

// The name in the LAN browser until the host picks one (local.cfg).
hostname "LAN Fun Server"
sv_password ""

mp_timelimit 25
mp_maxrounds 0
mp_winlimit 0
mp_roundtime 3
mp_roundtime_defuse 3
mp_startmoney 800
mp_c4timer 40
// Zombie and Deathrun play without the bomb.
mp_give_player_c4 1
mp_friendlyfire 0
mp_autoteambalance 1
mp_limitteams 2
sv_gravity 800
sv_autobunnyhopping 0
sv_enablebunnyhopping 0
sv_alltalk 1
// Also on the command line: a hibernating server runs no frames, so the
// live map and the fun plugin would stand still while only bots play.
sv_hibernate_when_empty 0
// CSTV itself is the host's choice (tv_enable in local.cfg); the delay is fixed.
tv_delay 10
// Fun rounds change these for one round.
mp_damage_headshot_only 0
bot_knives_only 0

// The FunServer plugin (hook, grab, parachute, fun rounds, streaks).
// The window's settings in local.cfg run after this file.
fun_hook_enabled 1
fun_hook_speed 750
fun_hook_admin_only 0
fun_grab_admin_only 1
fun_parachute_enabled 1
fun_rounds_enabled 1
fun_rounds_every 3
fun_streaks_enabled 1

// Bots are CS2's built-in bots. The block below holds the package defaults;
// the Server Control window reads them and saves the host's own values in
// fun/local_bots.cfg, which runs right after this file. Keep the markers
// and the cvar "value" format.
// --- Bots (Server Control) ---
bot_difficulty "1"
bot_quota "8"
bot_quota_mode "fill"
bot_join_team "any"
bot_join_after_player "1"
bot_allow_pistols "1"
bot_allow_shotguns "1"
bot_allow_sub_machine_guns "1"
bot_allow_rifles "1"
bot_allow_snipers "1"
bot_allow_machine_guns "0"
bot_allow_grenades "1"
bot_chatter "normal"
// --- End Bots ---
