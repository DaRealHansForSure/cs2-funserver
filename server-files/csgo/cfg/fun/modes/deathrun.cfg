// Deathrun: one Terrorist triggers the traps, everybody else runs the course
// as CT with a knife. The FunServer plugin picks the trapper each round and
// sets the teams itself, so team balancing is off here.
mp_roundtime 5
mp_freezetime 0
mp_round_restart_delay 3
mp_give_player_c4 0
mp_autoteambalance 0
mp_limitteams 0

// Hook and parachute would skip every trap.
fun_hook_enabled 0
fun_parachute_enabled 0

// Hold the space bar to bunnyhop, the courses are made for it.
sv_autobunnyhopping 1
sv_enablebunnyhopping 1

// Bots know neither the traps nor the course, they only get in the way.
bot_quota 0
